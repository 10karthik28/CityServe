<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CityServe</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px - 85px);
            padding: 2rem;
            background: radial-gradient(circle at top right, var(--surface-hover), var(--bg-color));
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <svg style="width: 28px; height: 28px; color: var(--primary-color);" fill="currentColor"
                    viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z"
                        clip-rule="evenodd"></path>
                </svg>
                Kerala CityServe
            </a>
            <div class="nav-links">
                <a href="index.html" class="btn btn-outline" style="padding: 0.25rem 0.75rem;">Login</a>
            </div>
        </div>
    </nav>

    <main class="main-content login-wrapper">
        <div class="card login-card animate-fade-in" id="forgotFlowCard">
            <div id="step1">
                <div class="text-center mb-4">
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text-primary);">Reset Password
                    </h1>
                    <p style="margin-bottom: 0; font-size: 0.875rem;">Enter your email to receive a password reset link.
                    </p>
                </div>

                <form id="forgotForm">
                    <div class="form-group">
                        <label class="form-label" for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" class="form-control" required
                            placeholder="example@email.com">
                    </div>
                    <button type="button" onclick="nextStep()" class="btn btn-primary"
                        style="width: 100%; padding: 0.875rem; font-weight: 600;">Send Reset Link</button>
                    <div class="text-center mt-4">
                        <a href="index.html" style="font-size: 0.875rem; color: var(--text-secondary);">Back to
                            Login</a>
                    </div>
                </form>
            </div>

            <div id="step2" style="display: none;">
                <div class="text-center mb-4">
                    <div
                        style="width: 48px; height: 48px; background: rgba(35, 134, 54, 0.1); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                            </path>
                        </svg>
                    </div>
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create New Password</h1>
                    <p style="margin-bottom: 0; font-size: 0.875rem;">(Simulation: Link clicked from email)</p>
                </div>

                <form id="newPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input type="password" id="newPassword" class="form-control" required
                            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="button" onclick="finishReset()" class="btn btn-primary"
                        style="width: 100%; padding: 0.875rem; font-weight: 600;">Update Password</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Kerala Municipal Service Request System. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        function nextStep() {
            const email = document.getElementById('resetEmail').value;
            if (!email) return alert('Please enter an email.');
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function finishReset() {
            const pwd = document.getElementById('newPassword').value;
            if (!pwd) return alert('Please enter a password.');

            document.getElementById('forgotFlowCard').innerHTML = `
                <div class="text-center">
                    <div style="width: 64px; height: 64px; background: rgba(35, 134, 54, 0.1); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                        <svg style="width: 32px; height: 32px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 style="margin-bottom: 1rem;">Password Reset!</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Your password has been successfully updated. You can now login with your new credentials.</p>
                    <a href="index.html" class="btn btn-primary" style="width: 100%; padding: 0.875rem;">Proceed to Login</a>
                </div>
            `;
        }
    </script>
</body>

</html>
